# Prod builds on merge to main; dev deploys are manual (Actions -> Run
# workflow on a branch), since a full build of this ~90k-item site is costly
# and every branch shares the one dev FQDN.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - "!.github/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hugo-build-release-deploy:
    secrets: inherit
    uses: chnm/.github/.github/workflows/hugo--build-release-deploy.yml@main
    with:
      hugo-context-root: "."
      hugo-devl-url: "https://911.dev.chnm.gmu.edu"
      hugo-prod-url: "https://911digitalarchive.org"

      release-tag-name-type: "iso"
      website-devl-fqdn: "911.dev.chnm.gmu.edu"
      website-prod-fqdn: "911digitalarchive.org"
